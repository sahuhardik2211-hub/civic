<!DOCTYPE html>
<html class="light" lang="en"><head>

<link href="web.css" rel="stylesheet"/>
<script>

<body class="bg-background text-on-surface min-h-screen pb-28">
<header class="bg-[#f8fafa] sticky top-0 z-50 flex justify-between items-center w-full px-6 py-3 border-b border-outline-variant/15">

<span class="text-xl font-bold text-[#005344] tracking-tight">Civic Conservator</span>
</div>
<a class="w-10 h-10 flex items-center justify-center text-[#3e4945] hover:bg-[#e1e3e3] transition-colors rounded-full" href="index.html" aria-label="Sign out"><span class="material-symbols-outlined">logout</span></a>
</header>
<main class="px-6 pt-8 max-w-2xl mx-auto">
<section class="bg-surface-container-lowest rounded-2xl p-6 mb-6 shadow-sm">
<div class="flex items-center gap-4">

<div>

<p id="profileEmail" class="text-sm text-on-surface-variant mt-1">Loading...</p>
</div>
</div>
</section>

</section>
<section class="bg-surface-container-lowest rounded-2xl overflow-hidden shadow-sm">
<div class="p-5 border-b border-outline-variant/15"><h2 class="text-lg font-bold">Account Details</h2></div>
<div class="divide-y divide-outline-variant/15">

<a class="flex flex-col items-center justify-center text-[#3e4945] px-5 py-2 hover:text-[#006d5b] transition-all active:scale-90" href="#"><span class="material-symbols-outlined">map</span><span class="font-['Manrope'] text-[12px] font-medium mt-1">Map</span></a>
<a class="flex flex-col items-center justify-center bg-[#c8eade] text-[#005344] rounded-2xl px-5 py-2 active:scale-90 transition-transform" href="#"><span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1;">person</span><span class="font-['Manrope'] text-[12px] font-bold mt-1">Profile</span></a>
